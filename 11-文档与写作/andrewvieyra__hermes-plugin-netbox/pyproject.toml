# Not a pip-installable package: Hermes loads this directory as a plugin. This file only carries
# tool configuration so `ruff` behaves the same locally and in CI.

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "B905", "UP007", "UP035", "UP006"]

[tool.ruff.lint.isort]
known-first-party = ["hermes_plugins"]

[tool.ruff.format]
quote-style = "double"
